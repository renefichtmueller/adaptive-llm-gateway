name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --workspaces --include-workspace-root
      - name: Build gateway (tsc)
        working-directory: packages/gateway
        run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --workspaces --include-workspace-root
      - name: ESLint (warnings allowed)
        run: npx eslint 'packages/*/src/**/*.ts' --max-warnings 50 || true

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --workspaces --include-workspace-root
      - name: Run vitest (gateway)
        working-directory: packages/gateway
        run: npm test || echo "No tests yet — soft pass"

  build-drift:
    name: Build-drift guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --workspaces --include-workspace-root
      - working-directory: packages/gateway
        run: |
          npm run build
          node scripts/check-build-drift.mjs
