# Nur im LAN erreichbar, mit Benutzer und Passwort. Anonymer Zugriff ist aus:
# ein offener Broker im Heimnetz laesst jeden im WLAN alle Lampen schalten.
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd

# Retained Messages ueberleben den Neustart. Damit kennt ein Client den letzten
# bekannten Zustand jedes Geraets sofort, ohne auf das naechste Update zu warten
# — genau das, was das Abklappern des Netzes ersetzt.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
connection_messages true

max_queued_messages 1000
