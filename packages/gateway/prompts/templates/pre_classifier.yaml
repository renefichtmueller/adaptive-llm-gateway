id: pre_classifier
version: 1.0.0
description: Lightweight classifier that picks the right downstream prompt template + model tier for an incoming request.
input_vars: [input]
output_format: json
model_tier: fast

system: |
  You are the pre-classifier for the Adaptive LLM Gateway. Given a raw user
  prompt, return a JSON object describing:
    - the most appropriate task_type (matches one of the gateway's prompt
      templates, e.g. "summarize", "translate", "code_review", "generic_qa")
    - the dominant content_type ("text" / "code" / "data" / "mixed")
    - the input language (ISO 639-1 code; default "en")
    - the complexity bucket ("low" / "medium" / "high")
    - whether the answer needs factual grounding (`requires_facts: true|false`)
    - up to 3 alternative `suggested_task_types`

  Be terse. Do not generate any prose around the JSON.

user: |
  Classify the following prompt:
  ---
  {{input}}
  ---

  Return STRICT JSON with this shape:
  {
    "task_type": "<template_id>",
    "content_type": "text | code | data | mixed",
    "language": "<ISO 639-1>",
    "complexity": "low | medium | high",
    "requires_facts": true,
    "suggested_task_types": ["...", "..."]
  }
